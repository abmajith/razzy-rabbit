[project]
name = "razzy-rabbit"
version = "0.1.0"
description = "Robotics design and simulation suite"
requires-python = ">=3.11"
dependencies = [
    "pyvista[all]",
    "pyvistaqt",
    "PyQt6",
    "numpy",
    "gmsh>=4.15.2",
    "scipy>=1.15.3",
    "meshio>=5.3.5",
    "trimesh>=4.11.5",
    "manifold3d>=3.4.1",
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
]

[project.optional-dependencies]
sim = [
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.8.1",
    "mujoco==4.0.0",
    "razzy-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razzy_rabbit"]

[tool.uv.sources]
razzy-core = { path = "sim/cpp/core" }

[tool.pytest.ini_options]
pythonpath = ["."]
