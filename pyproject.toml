[project]
name = "razzy-rabbit"
version = "0.1.0"
description = "Robotics design and simulation suite"
requires-python = ">=3.10"
dependencies = [
    "pyvista[all]",
    "pyvistaqt",
    "PyQt6",
    "numpy",
    "gmsh>=4.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/razzy_rabbit"]
