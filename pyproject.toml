[project]
name = "razzy-rabbit"
version = "0.1.0"
description = "Simulation-in-the-loop design of field robots"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pytest>=9.0.2",
]

[project.optional-dependencies]
sim = [
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.8.1",
    "mujoco==4.0.0",
    "razzy-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim"]

[tool.uv.sources]
razzy-core = { path = "sim/cpp/core" }

[tool.pytest.ini_options]
pythonpath = ["."]
