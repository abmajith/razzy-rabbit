[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4", "mujoco==4.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "razzy-core"
version = "0.1.0"
description = "C++ simulation core for razzy-rabbit (batched MuJoCo envs, plants, sensors)"
requires-python = ">=3.11"
dependencies = ["numpy", "mujoco==4.0.0"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/razzy_core"]

[tool.uv]
# rebuild the extension whenever the C++ sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "csrc/**/*.cpp" }, { file = "csrc/**/*.hpp" }]
