# =====================================================================================
# DRONE: propellers (static coefficients, n in rev/s, D in m)
#   thrust T = ct * rho * n^2 * D^4        shaft power P = cp * rho * n^3 * D^5
#   blades: sets the blade-pass vibration frequency (blades x rotor speed)
# =====================================================================================
