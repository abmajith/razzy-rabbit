# Component database for vehicle sizing.
#
# Values are representative of commonly available hobby/industrial parts (rounded from
# typical datasheets). They are NOT vendor-certified: when you pick real parts, copy
# their datasheet numbers in here. Add a new part by adding a new [section.name] block;
# the optimiser picks it up automatically.
#
# Units: SI unless the key says otherwise (_g grams, _mm millimetres, _in inches,
#        _mah milliamp-hours, kv rpm/V).

# =====================================================================================
# DRONE: brushless outrunner motors
#   kv        rpm per volt          r_ohm     winding resistance
#   i0        no-load current [A]   i_max     max continuous current [A]
#   cells     supported LiPo cell count range [min, max]
#   prop_in   supported prop diameter range [min, max] inches
#   stator_mm stator diameter (used for rotor inertia + visual size)
# =====================================================================================
[motor.m1404_3000kv]
kv = 3000
r_ohm = 0.20
i0 = 0.5
i_max = 12
mass_g = 9
stator_mm = 14
cells = [3, 4]
prop_in = [3.0, 3.5]

