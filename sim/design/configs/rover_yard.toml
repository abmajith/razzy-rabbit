# Mission spec for the six-wheel rocker-bogie rover (Mars-rover style suspension).
# Edit numbers here, then:  uv run --extra sim python -m sim design rover

[mission]
name = "rocker-bogie field rover"
payload_kg = 3.0           # sensors, arm, samples...
max_slope_deg = 20         # must climb and not tip on this slope
obstacle_height_m = 0.15   # step/rock the rover must climb
cruise_speed_mps = 0.6
min_range_km = 3.0         # on flat terrain at cruise speed, after the reserve
reserve_frac = 0.2
terrain_crr = 0.08         # rolling resistance: 0.02 hard floor, 0.06-0.10 grass/packed soil, 0.15-0.3 loose sand
terrain_mu = 0.6           # traction coefficient (peak tractive force / normal force)
max_width_m = 0.95
max_length_m = 1.3
min_clearance_m = 0.18     # ground clearance under the body
tip_margin_deg = 10        # static tip-over angle must exceed max_slope by this much
climb_factor = 1.5         # rocker-bogie climbs obstacles up to climb_factor x wheel radius
gravity = 9.81             # 3.71 for Mars

[body]
length_m = 0.50
width_m = 0.32
height_m = 0.16
electronics_g = 1200       # computer, motor drivers, sensors, wiring
avionics_w = 12            # continuous electrical load besides the drive motors
steer_servo = "servo_35kg" # 4 corner-steering servos (Curiosity / Perseverance style)

[design_space]
wheels = "all"
drive_motors = "all"
batteries = ["liion_3s4p_14000", "liion_6s2p_7000", "liion_6s4p_14000", "lifepo4_4s_20000"]
tubes = "all"

[structure]
max_tube_stress_mpa = 60   # bending stress in a rocker leg at 2 g vertical load (Al 6061 yield ~240)

[objective]
maximize = "range"         # "range" | "min_mass"

[sensors]
imu = "bmi088"
mag = "ist8310"
gnss = "ublox_m10"

[installation]
mag_current_ut_per_a = 0.3
gnss_antenna_height_m = 0.35

[environment]
field_ut = 47.5
inclination_deg = 62
declination_deg = 2.5

[uncertainty]
# See drone_forest.toml / docs/uncertainty.md. a -> factor 1±a ; [lo, hi] -> range.
mass_frac = 0.08            # payload not exactly 3 kg
inertia_frac = 0.15
com_offset_mm = [30, 20]    # payload placement
drive_torque = 0.10         # gearmotor batch, temperature
drive_gain = 0.05           # per motor
steer_kp = 0.20
battery_capacity = [0.85, 1.0]
battery_resistance = [0.9, 1.6]
imu_noise = [0.9, 1.5]
imu_bias = [0.5, 2.0]
mag_current = [0.5, 2.0]
gnss_multipath = [0.5, 1.5]
latency_ms_add = [0, 15]
friction = 0.25             # soil / rock surface
require_slope_torque_frac = 0.8
require_tip_deg = 25
