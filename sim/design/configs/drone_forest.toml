# Mission spec for the forest-inspection quadrotor.
# Edit numbers here, then:  uv run --extra sim python -m sim design drone
# Every requirement is a hard constraint; the objective ranks the feasible designs.

[mission]
name = "forest inspection quad"
max_span_m = 0.42          # tip-to-tip incl. cage. Dense forest gaps ~1.5 m -> keep well below
min_twr = 2.5              # thrust-to-weight at END of discharge (agility + wind margin)
min_endurance_min = 10     # usable flight time, after the reserve below
reserve_frac = 0.25        # battery fraction never planned for use (return / landing margin)
maneuver_factor = 1.25     # mean power / hover power (forward flight, avoidance, climbs)
max_hover_throttle = 0.45  # hover thrust / max thrust at nominal voltage
air_density = 1.20         # kg/m^3 (1.225 sea level 15 C; lower when hot or high)
gravity = 9.81
cage = true                # protective cage around props (collision tolerant, heavier)

[payload]
# fixed items from [avionics.*] in components.toml
items = ["fc_stack_h7", "gnss_m10", "lora_868", "oakd_lite", "pi_zero2w"]
extra_mass_g = 0           # anything else you carry (sensors, mounts)

[design_space]
# "all" or a list of names from components.toml
motors = "all"
props = "all"
batteries = "all"
arm_tubes = "all"
prop_clearance = 0.15      # gap between adjacent prop tips, fraction of prop diameter
min_arm_m = 0.07           # arms can't be shorter than the centre stack needs

[structure]
max_arm_deflection_frac = 0.01   # arm tip deflection at max thrust / arm length
min_arm_freq_hz = 80             # first bending mode of an arm with motor at the tip

[objective]
maximize = "endurance"     # "endurance" | "twr" | "min_mass"

[sensors]
# parts from components.toml; delete a line to fly without that sensor
imu = "icm42688p"
baro = "bmp390"
mag = "ist8310"
gnss = "ublox_m10"
depth_camera = "oakd_lite_stereo"
rgb_camera = "oakd_lite_rgb"

[installation]
# how the parts are mounted; these change the data as much as the parts do
imu_mount_hz = 90             # flight-controller soft mount natural frequency (1e4 = hard mounted)
imu_mount_zeta = 0.15         # damping of that mount (rubber ~0.1-0.2)
arm_zeta = 0.02               # structural damping of the arms (carbon ~0.01-0.03)
prop_imbalance_gmm = 0.5      # residual imbalance per motor+prop [g mm]; balanced 5in ~0.2-1
thrust_ripple = 0.03          # blade-pass thrust ripple, fraction of rotor thrust
baro_static_cp = 0.3          # static-port pressure error coefficient (airspeed -> altitude error)
mag_current_ut_per_a = 0.15   # field at the compass per amp of battery current
gnss_antenna_height_m = 0.07  # antenna above the CoM

[environment]
# Earth magnetic field at the flying site (look it up: NOAA/BGS WMM calculator)
field_ut = 47.5
inclination_deg = 62
declination_deg = 2.5

[compute]
part = "oakd_myriadx"         # where the policy runs (components.toml [compute.*])
