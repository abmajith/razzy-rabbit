# Energy: battery packs and cell chemistry
#
# Datasheet values only: no code reads a specific part. Values are representative of
# commonly available parts (rounded from typical datasheets), NOT vendor-certified: copy
# your real parts' datasheet numbers in here. Add a part by adding a [section.name] block.
#
# Units: SI unless the key says otherwise (_g grams, _mm millimetres, _in inches,
#        _mah milliamp-hours, kv rpm/V).

# =====================================================================================
# Batteries (drone and rover)
#   chemistry  "lipo" | "liion" | "lifepo4"   (sets OCV curve + nominal cell voltage)
#   c_max      max continuous discharge in C   r_cell  internal resistance per cell [ohm]
#   series/parallel describe the pack; capacity is the whole pack
# =====================================================================================
[battery.lipo_3s_1000]
chemistry = "lipo"
cells = 3
capacity_mah = 1000
mass_g = 85
c_max = 75
r_cell = 0.010
size_mm = [70, 34, 22]

