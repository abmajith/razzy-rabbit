# =====================================================================================
# Cell chemistry: open-circuit voltage per cell vs state of charge (used by
# sim/physics/battery.py). nominal = rated cell voltage, cutoff = end of discharge.
# =====================================================================================
[chemistry.lipo]
nominal = 3.7
cutoff = 3.5
soc = [0.0, 0.05, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
ocv = [3.30, 3.55, 3.65, 3.74, 3.80, 3.88, 4.05, 4.20]

[chemistry.liion]
nominal = 3.6
cutoff = 3.0
soc = [0.0, 0.05, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
ocv = [3.00, 3.25, 3.40, 3.55, 3.65, 3.80, 4.00, 4.20]

[chemistry.lifepo4]
