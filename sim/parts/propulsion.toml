# Propulsion: brushless motors and propellers
#
# Datasheet values only: no code reads a specific part. Values are representative of
# commonly available parts (rounded from typical datasheets), NOT vendor-certified: copy
# your real parts' datasheet numbers in here. Add a part by adding a [section.name] block.
#
# Units: SI unless the key says otherwise (_g grams, _mm millimetres, _in inches,
#        _mah milliamp-hours, kv rpm/V).

# =====================================================================================
# DRONE: brushless outrunner motors
#   kv        rpm per volt          r_ohm     winding resistance
#   i0        no-load current [A]   i_max     max continuous current [A]
#   cells     supported LiPo cell count range [min, max]
#   prop_in   supported prop diameter range [min, max] inches
#   stator_mm stator diameter (used for rotor inertia + visual size)
# =====================================================================================
